<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F9FAFC; --surface:#FFFFFF; --ink:#101B33; --ink2:#45526B;
  --rule:#DCE1EA; --rule2:#B9C1D0;
  --accent:#2447F5; --accent-ink:#FFFFFF;
  --warn:#B42318; --warnbg:#FDECEA;
  --sleep:rgba(16,27,51,.06); --peak:rgba(36,71,245,.07);
  --k-foco:#2B2F8F; --k-leve:#0F766E; --k-estudo:#B45309; --k-comp:#4B5563; --k-rec:#2F7D4F;
  --hour:52px;
  --font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1322; --surface:#141C30; --ink:#E9EDF7; --ink2:#A2AEC6;
    --rule:#243049; --rule2:#3A4867;
    --accent:#7F95FF; --accent-ink:#0B1226;
    --warn:#FF8A80; --warnbg:#3A1C1F;
    --sleep:rgba(0,0,0,.28); --peak:rgba(127,149,255,.10);
  }
}
:root[data-theme="dark"]{
  --paper:#0D1322; --surface:#141C30; --ink:#E9EDF7; --ink2:#A2AEC6;
  --rule:#243049; --rule2:#3A4867;
  --accent:#7F95FF; --accent-ink:#0B1226;
  --warn:#FF8A80; --warnbg:#3A1C1F;
  --sleep:rgba(0,0,0,.28); --peak:rgba(127,149,255,.10);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--font)}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;padding:22px clamp(12px,3vw,32px) 72px}

/* topo */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.mast h1{margin:0;font:700 clamp(30px,5vw,54px)/1 var(--font);letter-spacing:-.035em}
.mast .yr{font-weight:400;color:var(--ink2)}
.sumline{margin:10px 0 0;color:var(--ink2);font-size:14px}
.mast-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;align-items:flex-end;gap:4px;flex-basis:100%;margin-top:8px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 14px;font:600 14px var(--font);color:var(--ink2);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.sync{margin-left:auto;padding:0 0 10px 12px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.sync.err{color:var(--warn)}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 14px;border:1px solid var(--rule2);border-radius:6px;background:var(--surface);color:var(--ink);font:600 14px var(--font);cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.text{border-color:transparent;background:transparent}
.btn.text:hover{background:var(--rule)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.icon{width:36px;padding:0}

/* objetivos */
.goals{margin:20px 0 22px}
.goals h2,.sec h2{margin:0 0 2px;font:700 19px var(--font);letter-spacing:-.01em}
.sub{margin:0 0 12px;color:var(--ink2);font-size:13.5px}
.goal-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 26px}
.goal{border-top:2px solid var(--ink);padding-top:8px}
.goal-in{display:block;width:100%;min-height:52px;resize:none;padding:4px 0;border:0;border-bottom:1px solid var(--rule2);border-radius:0;background:transparent;color:var(--ink);font:500 15px/1.35 var(--font)}
.goal-in::placeholder{color:var(--ink2);opacity:.8}
.gp{display:grid;gap:5px;margin-top:8px}
.bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.gpt{font-size:12.5px;color:var(--ink2)}

.empty-note{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:0 0 16px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--peak);font-size:14px}
.empty-note p{margin:0;flex:1 1 320px}

/* grade */
.daytabs{display:none;gap:4px;margin:0 0 10px}
.daytab{flex:1;min-width:0;min-height:44px;padding:4px 2px;border:1px solid var(--rule2);border-radius:6px;background:var(--surface);color:var(--ink);font:600 13px/1.15 var(--font);cursor:pointer}
.daytab span{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.daytab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.daytab[aria-pressed="true"] span{color:var(--paper);opacity:.85}
.daytab.today{box-shadow:inset 0 -3px 0 var(--accent)}
.grid{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border:1px solid var(--rule2);border-radius:8px;background:var(--surface);overflow:hidden}
.corner{border-bottom:1px solid var(--rule2)}
.dh{min-width:0;padding:9px 8px 10px;border-bottom:1px solid var(--rule2);border-left:1px solid var(--rule)}
.dh.today{box-shadow:inset 0 3px 0 var(--accent)}
.dh.today .dn,.dh.today .dd{color:var(--accent)}
.dn{font-size:13px;color:var(--ink2);font-weight:500}
.dd{margin-left:6px;font:700 24px/1 var(--font);letter-spacing:-.02em}
.cap{height:4px;margin:9px 0 5px;border-radius:2px;background:var(--rule);overflow:hidden}
.cap>span{display:block;height:100%;background:var(--ink2)}
.cap.over>span{background:var(--warn)}
.capt{font-size:12px;color:var(--ink2)}
.warnt{margin-top:2px;font-size:12px;font-weight:600;line-height:1.25;color:var(--warn)}
.gut .hr{height:var(--hour);padding:3px 7px 0 0;text-align:right;font-size:11.5px;color:var(--ink2)}
.col{position:relative;border-left:1px solid var(--rule);cursor:cell;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),var(--rule) calc(var(--hour) - 1px),var(--rule) var(--hour))}
.sleepz{position:absolute;left:0;right:0;pointer-events:none;background-color:var(--sleep);
  background-image:repeating-linear-gradient(135deg,transparent 0,transparent 6px,rgba(127,140,165,.16) 6px,rgba(127,140,165,.16) 7px)}
.peakz{position:absolute;left:0;right:0;pointer-events:none;background:var(--peak)}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--accent);pointer-events:none;z-index:3}
.now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.blk{position:absolute;z-index:2;display:flex;align-items:flex-start;gap:5px;overflow:hidden;padding:3px 6px 3px 4px;border-radius:4px;color:#fff;font-size:12.5px;line-height:1.2;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.blk:hover{filter:brightness(1.1)}
.k-foco{background:var(--k-foco)} .k-leve{background:var(--k-leve)} .k-estudo{background:var(--k-estudo)} .k-comp{background:var(--k-comp)} .k-rec{background:var(--k-rec)}
.chk{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-top:1px;padding:0;border:1.5px solid rgba(255,255,255,.9);border-radius:3px;background:transparent;color:#fff;cursor:pointer}
.chk::after{content:"";position:absolute;inset:-6px}
.blk.done{opacity:.6}
.blk.done .chk{background:#fff;color:#101B33}
.blk.done .tt{text-decoration:line-through}
.bt{display:flex;flex-direction:column;min-width:0}
.tt{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.tm{font-size:11.5px;opacity:.92}
.lk{display:inline-flex;align-items:center;gap:3px;font-size:11.5px}
.blk.tight .bt{flex-direction:row;align-items:center;gap:6px}
.blk.tight .tt{-webkit-line-clamp:1}
.blk.tight .tm{display:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink2)}
.legend li{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--c)}
.sw.peak{background:var(--peak);border:1px solid var(--accent)}
.sw.sleep{background:var(--sleep);border:1px solid var(--rule2)}

/* janelas */
dialog.dlg{width:min(720px,calc(100vw - 20px));max-height:min(92vh,900px);padding:0;border:1px solid var(--rule2);border-radius:10px;background:var(--surface);color:var(--ink)}
dialog.dlg[open]{display:flex;flex-direction:column}
dialog.dlg.small{width:min(520px,calc(100vw - 20px))}
dialog::backdrop{background:rgba(8,13,28,.55)}
.dlg-form{display:flex;flex-direction:column;flex:1;min-height:0}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--rule)}
.dlg-h h2{margin:0;font:700 21px var(--font);letter-spacing:-.015em}
.dlg-b{display:grid;gap:16px;flex:1;min-height:0;padding:16px 20px;overflow:auto}
.dlg-f{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
.dlg-f .spacer{margin-right:auto}
.field>label,.fl{display:block;margin-bottom:4px;font-weight:600;font-size:13.5px}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea,.mat-add input{width:100%;padding:8px 10px;border:1px solid var(--rule2);border-radius:6px;background:var(--surface);color:var(--ink);font:400 16px/1.35 var(--font)}
.field textarea{resize:vertical}
.help{margin:4px 0 0;color:var(--ink2);font-size:12.5px}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.err{margin:0;min-height:0;color:var(--warn);font-size:13px;font-weight:600}
.err:empty{display:none}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kind{position:relative}
.kind input{position:absolute;opacity:0;width:1px;height:1px}
.kind span{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--rule2);border-radius:999px;font-size:13.5px;cursor:pointer}
.kind span::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.kind input:checked+span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.kind input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.hints{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.hints:empty{display:none}
.hints li{padding:8px 10px;border-left:3px solid var(--accent);background:var(--peak);font-size:13px}
.hints li.warn{border-left-color:var(--warn);background:var(--warnbg)}
.inline{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.inline input{width:18px;height:18px}
.two{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.two>label{font-weight:600;font-size:13.5px}
.radios{display:grid;gap:6px}
.radios label{display:flex;gap:8px;align-items:center;font-size:14px}
.radios input{width:18px;height:18px}

/* materiais */
.mat-list{display:grid;gap:4px;margin:0 0 8px;padding:0;list-style:none}
.mat-list li{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 4px 4px 10px;border:1px solid var(--rule);border-radius:6px}
.mat-list li.empty{display:block;padding:8px 10px;border-style:dashed;color:var(--ink2);font-size:13px}
.mat-list a{min-width:0;overflow:hidden;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;text-overflow:ellipsis;white-space:nowrap}
.mat-list svg{flex:none;color:var(--ink2)}
.mat-host{flex:none;color:var(--ink2);font-size:12.5px}
.mat-list .btn{margin-left:auto;flex:none}
.mat-add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) auto;gap:6px}
.mat-add input{min-height:36px;padding:5px 9px;font-size:15px}

/* materiais (aba) e revisão */
.sec{margin:26px 0 0}
.daygrp{margin:22px 0 0}
.daygrp>h3{margin:0 0 8px;font:700 16px var(--font)}
.mt{display:grid;gap:8px;margin:0 0 12px;padding:12px 0 12px 14px;border-left:5px solid var(--c);border-bottom:1px solid var(--rule)}
.mt-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.mt-h h4{margin:0;font:700 16px var(--font)}
.mt-h p{margin:0;color:var(--ink2);font-size:13px}
.cue{margin:0;font:italic 400 15px/1.5 var(--serif);color:var(--ink2);max-width:70ch}
.stats{display:grid;grid-template-columns:minmax(0,16rem) 1fr;margin:8px 0 0;max-width:820px}
.stats dt,.stats dd{margin:0;padding:12px 0;border-top:1px solid var(--rule)}
.stats dt{color:var(--ink2)}
.stats dd{font-weight:600}
.goalrev{display:grid;gap:6px;max-width:820px;padding:12px 0;border-top:1px solid var(--rule)}
.goalrev .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.reflect{display:grid;gap:16px;max-width:70ch;margin-top:8px}

/* métodos */
.methods{max-width:70ch;margin-top:20px;font:400 17px/1.65 var(--serif)}
.methods .lead{font-size:18px}
.methods article{padding:20px 0;border-top:1px solid var(--rule)}
.methods h3{margin:0 0 6px;font:700 20px var(--font);letter-spacing:-.01em}
.methods p{margin:0 0 10px}
.methods .no-app{padding:8px 12px;border-left:3px solid var(--accent);background:var(--peak)}
.methods .ev{color:var(--ink2);font-size:15px}
.methods .ev b{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;max-width:min(520px,calc(100vw - 24px));padding:10px 16px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:14px;opacity:0;pointer-events:none;transform:translate(-50%,8px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .goal-row{grid-template-columns:1fr}
  .daytabs{display:flex}
  .grid{grid-template-columns:40px minmax(0,1fr)}
  .grid .dh:not(.active),.grid .col:not(.active){display:none}
  .gut .hr{padding-right:4px;font-size:10.5px}
  .stats{grid-template-columns:1fr}
  .stats dt{padding-bottom:0;border-bottom:0}
  .stats dd{border-top:0;padding-top:2px}
}
@media (max-width:560px){
  .row{grid-template-columns:1fr 1fr}
  .row .field:first-child{grid-column:1/-1}
  .mat-add{grid-template-columns:1fr}
  .dlg-h,.dlg-b,.dlg-f{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="mast" id="mast"></header>
  <main id="view" tabindex="-1"></main>
</div>
<dialog id="dlg" class="dlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- constantes ---------- */
var HOUR_PX=52;
var DAYS_SHORT=['seg','ter','qua','qui','sex','sáb','dom'];
var DAYS_LONG=['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'];
var KINDS={
  foco:{label:'Foco profundo'},
  leve:{label:'Tarefas leves'},
  estudo:{label:'Estudo'},
  comp:{label:'Compromisso fixo'},
  rec:{label:'Recuperação'}
};
var KIND_KEYS=Object.keys(KINDS);
var DURS=[15,25,30,45,50,60,75,90,120,150,180,240];
var PEAKS={
  manha:{label:'Manhã',when:'de manhã',from:480,to:720,txt:'8h às 12h'},
  tarde:{label:'Tarde',when:'à tarde',from:780,to:1020,txt:'13h às 17h'},
  noite:{label:'Noite',when:'à noite',from:1080,to:1320,txt:'18h às 22h'}
};
var GOAL_PH=[
  'Ex.: Entregar o relatório final até quinta, às 17h',
  'Ex.: Concluir 3 módulos do curso e resolver 20 exercícios',
  'Ex.: Treinar 3 vezes na semana, 40 minutos cada'
];
var LS_KEY='planner-semanal-v1';

/* ---------- utilidades ---------- */
function $(s,r){return (r||document).querySelector(s);}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7));}
function weekKeyOf(ds){return iso(mondayOf(parse(ds)));}
function toMin(t){var p=String(t).split(':').map(Number);return (p[0]||0)*60+(p[1]||0);}
function fromMin(m){return pad(Math.floor(m/60))+':'+pad(m%60);}
function fmtDur(m){m=Math.round(m);var hh=Math.floor(m/60),mm=m%60;if(!hh)return mm+'min';if(!mm)return hh+'h';return hh+'h'+pad(mm);}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function trunc(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s;}
function weekLabel(mon){
  var sun=addDays(mon,6);
  if(mon.getMonth()===sun.getMonth()){
    return mon.getDate()+' a '+sun.getDate()+' de '+new Intl.DateTimeFormat('pt-BR',{month:'long'}).format(sun);
  }
  var f=new Intl.DateTimeFormat('pt-BR',{day:'numeric',month:'short'});
  return f.format(mon)+' a '+f.format(sun);
}
function fmtShortDate(ds){var d=parse(ds);return DAYS_SHORT[(d.getDay()+6)%7]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1);}
function plural(n,one,many){return n+' '+(n===1?one:many);}
function safeUrl(raw){
  var s=String(raw||'').trim();
  if(!s||/\s/.test(s))return null;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(s))s='https://'+s;
  try{
    var u=new URL(s);
    if(u.protocol!=='http:'&&u.protocol!=='https:')return null;
    if(u.hostname.indexOf('.')===-1)return null;
    return u.href;
  }catch(e){return null;}
}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}}
function cmpTask(a,b){return a.date===b.date?(toMin(a.start)-toMin(b.start)):(a.date<b.date?-1:1);}

/* ---------- criação de elementos (sem innerHTML) ---------- */
function append(el,kids){
  for(var i=0;i<kids.length;i++){
    var k=kids[i];
    if(k===null||k===undefined||k===false)continue;
    if(Array.isArray(k))append(el,k);
    else el.append(k.nodeType?k:document.createTextNode(String(k)));
  }
}
function h(tag,props){
  var el=document.createElement(tag),val,hasVal=false;
  if(props){
    Object.keys(props).forEach(function(k){
      var v=props[k];
      if(v===null||v===undefined||v===false)return;
      if(k==='class')el.className=v;
      else if(k==='value'){val=v;hasVal=true;}
      else if(k==='checked')el.checked=!!v;
      else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2).toLowerCase(),v);
      else if(v===true)el.setAttribute(k,'');
      else el.setAttribute(k,String(v));
    });
  }
  append(el,Array.prototype.slice.call(arguments,2));
  if(hasVal)el.value=val;
  return el;
}
var SVGNS='http://www.w3.org/2000/svg';
var ICONS={
  left:'M15 5l-7 7 7 7',
  right:'M9 5l7 7-7 7',
  plus:'M12 5v14M5 12h14',
  check:'M5 12.5l4.5 4.5L19 7.5',

/* ---------- estado ---------- */
var S={settings:defaultSettings(),weeks:{}};
function defaultSettings(){return {wake:'07:00',sleep:'23:00',usefulHours:8,buffer:25,peak:'manha',updatedAt:0};}
function newWeek(){return {goals:['','',''],goalsDone:[false,false,false],review:{worked:'',blocked:'',adjust:'',obstacle:''},materials:[],tasks:[],updatedAt:0};}
function blankTask(){return {id:uid(),title:'',date:iso(new Date()),start:'09:00',dur:60,kind:'foco',goal:-1,done:false,doneWhen:'',cue:'',notes:'',actual:'',materials:[]};}
function normMats(arr){
  var out=[];
  (Array.isArray(arr)?arr:[]).forEach(function(m){
    if(!m||typeof m.url!=='string')return;
    var u=safeUrl(m.url);
    if(!u)return;
    out.push({id:String(m.id||uid()),title:String(m.title||'').slice(0,80),url:u});
  });
  return out;
}
function normTask(t){
  var o=Object.assign(blankTask(),t||{});
  o.id=String(o.id);
  o.title=String(o.title||'').slice(0,120);
  o.materials=normMats(o.materials);
  o.dur=Math.max(5,parseInt(o.dur,10)||60);
  o.goal=(o.goal===0||o.goal===1||o.goal===2)?o.goal:-1;
  if(!KINDS[o.kind])o.kind='foco';
  if(!/^\d{2}:\d{2}$/.test(o.start))o.start='09:00';
  o.done=!!o.done;
  o.actual=(o.actual===''||o.actual===null||o.actual===undefined)?'':(Number(o.actual)>0?Math.round(Number(o.actual)):'');
  ['doneWhen','cue','notes'].forEach(function(k){o[k]=String(o[k]||'');});
  return o;
}
function normWeek(w){
  var o=Object.assign(newWeek(),w||{});
  o.goals=[0,1,2].map(function(i){return String((o.goals&&o.goals[i])||'');});
  o.goalsDone=[0,1,2].map(function(i){return !!(o.goalsDone&&o.goalsDone[i]);});
  o.review=Object.assign({worked:'',blocked:'',adjust:'',obstacle:''},o.review||{});
  o.materials=normMats(o.materials);
  o.tasks=(Array.isArray(o.tasks)?o.tasks:[]).map(normTask);
  o.updatedAt=Number(o.updatedAt)||0;
  return o;
}
function normSettings(s){
  var o=Object.assign(defaultSettings(),s||{});
  if(!/^\d{2}:\d{2}$/.test(o.wake))o.wake='07:00';
  if(!/^\d{2}:\d{2}$/.test(o.sleep))o.sleep='23:00';
  o.usefulHours=Math.min(16,Math.max(1,Number(o.usefulHours)||8));
  o.buffer=Math.min(50,Math.max(0,Number(o.buffer)));
  if(isNaN(o.buffer))o.buffer=25;
  if(!PEAKS[o.peak])o.peak='manha';
  o.updatedAt=Number(o.updatedAt)||0;
  return o;
}
function getWeek(key){if(!S.weeks[key])S.weeks[key]=newWeek();return S.weeks[key];}
function findTask(id){
  var keys=Object.keys(S.weeks);
  for(var a=0;a<keys.length;a++){
    var w=S.weeks[keys[a]];
    for(var i=0;i<w.tasks.length;i++){if(w.tasks[i].id===id)return {task:w.tasks[i],week:w,key:keys[a],index:i};}
  }
  return null;
}

/* ---------- persistência: conta (db) + navegador ---------- */
var dirty=new Set(),saveTimer=null,syncing=false,remote=null,syncState='local',pendingRender=false;
function touch(key){
  var obj=key==='settings'?S.settings:S.weeks[key];
  if(!obj)return;
  obj.updatedAt=Date.now();
  dirty.add(key);
  saveLocal();
  scheduleRemote();
}
function saveLocal(){
  try{
    var weeks={};
    Object.keys(S.weeks).forEach(function(k){var w=S.weeks[k];if(w.updatedAt||w.tasks.length)weeks[k]=w;});
    localStorage.setItem(LS_KEY,JSON.stringify({settings:S.settings,weeks:weeks}));
  }catch(e){}
}
function loadLocal(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(!raw)return;
    var o=JSON.parse(raw);
    if(!o||!o.weeks)return;
    S.settings=normSettings(o.settings);
    Object.keys(o.weeks).forEach(function(k){S.weeks[k]=normWeek(o.weeks[k]);});
  }catch(e){}
}
var SYNC_TXT={local:'Salvo neste navegador',loading:'Conectando à sua conta…',saving:'Salvando…',saved:'Salvo na sua conta',error:'Falha ao salvar na conta, tentando de novo'};
function setSync(st){
  syncState=st;
  var el=$('#sync');
  if(el){el.textContent=SYNC_TXT[st];el.className='sync'+(st==='error'?' err':'');}
}
function scheduleRemote(){
  if(!remote)return;
  clearTimeout(saveTimer);
  setSync('saving');
  saveTimer=setTimeout(flush,700);
}
function flush(){
  if(!remote)return Promise.resolve();
  if(syncing){clearTimeout(saveTimer);saveTimer=setTimeout(flush,400);return Promise.resolve();}
  syncing=true;
  var chain=Promise.resolve();
  function next(){
    if(!dirty.size)return Promise.resolve();
    var key=dirty.values().next().value;
    dirty.delete(key);
    var obj=key==='settings'?S.settings:S.weeks[key];
    if(!obj)return next();
    var ref=key==='settings'?remote.root:remote.weeks.doc(key);
    return ref.set({payload:JSON.stringify(obj),updatedAt:obj.updatedAt}).then(next,function(err){
      dirty.add(key);
      throw err;
    });
  }
  return chain.then(next).then(function(){
    syncing=false;
    setSync(dirty.size?'saving':'saved');
    if(dirty.size){saveTimer=setTimeout(flush,400);}
  },function(){
    syncing=false;
    setSync('error');
    clearTimeout(saveTimer);
    saveTimer=setTimeout(flush,15000);
  });
}
function mergeRemote(key,data,live){
  if(!data||typeof data.payload!=='string')return;
  var obj;
  try{obj=JSON.parse(data.payload);}catch(e){return;}
  var local=key==='settings'?S.settings:S.weeks[key];
  var lu=local?(local.updatedAt||0):0;
  var ru=Number(obj.updatedAt)||0;
  if(ru>lu){
    if(key==='settings')S.settings=normSettings(obj);
    else S.weeks[key]=normWeek(obj);
    if(live){
      saveLocal();
      if(modalOpen()||isTyping())pendingRender=true;else render();
    }
  }else if(lu>ru&&!live){
    dirty.add(key);
  }
}
function initRemote(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return;
    return user.id().then(function(uidv){
      if(!uidv)return;
      setSync('loading');
      var root=db.doc('data/users/'+uidv+'/planner');
      var weeks=root.collection('weeks');
      return root.get().then(function(snap){
        if(snap.exists)mergeRemote('settings',snap.data(),false);
        else if(S.settings.updatedAt)dirty.add('settings');
        return weeks.get();
      }).then(function(qs){
        var seen={};
        qs.docs.forEach(function(d){seen[d.id]=true;mergeRemote(d.id,d.data(),false);});
        Object.keys(S.weeks).forEach(function(k){if(!seen[k]&&S.weeks[k].updatedAt)dirty.add(k);});
        remote={root:root,weeks:weeks};
        saveLocal();
        render();
        if(dirty.size)scheduleRemote();else setSync('saved');
        root.onSnapshot(function(s){if(s.exists)mergeRemote('settings',s.data(),true);},function(){});
        weeks.onSnapshot(function(q){
          q.docChanges().forEach(function(c){if(c.type!=='removed')mergeRemote(c.doc.id,c.doc.data(),true);});
        },function(){});
      });
    });
  }).catch(function(){remote=null;setSync('local');});
}

/* ---------- cálculos ---------- */
function dayLimit(){return Math.round(S.settings.usefulHours*60*(1-S.settings.buffer/100));}
function weekStats(tasks){
  var r={planned:0,deep:0,done:0,doneMin:0,doneDeep:0,total:tasks.length};
  tasks.forEach(function(t){
    if(t.kind!=='rec')r.planned+=t.dur;
    if(t.kind==='foco')r.deep+=t.dur;
    if(t.done){
      r.done++;
      if(t.kind!=='rec')r.doneMin+=t.dur;
      if(t.kind==='foco')r.doneDeep+=t.dur;
    }
  });
  return r;
}
function gridRange(tasks){
  var s=toMin(S.settings.wake),e=toMin(S.settings.sleep);
  tasks.forEach(function(t){s=Math.min(s,toMin(t.start));e=Math.max(e,toMin(t.start)+t.dur);});
  s=Math.floor(s/60)*60;e=Math.min(Math.ceil(e/60)*60,1440);
  return {s:s,e:e};
}
function layoutDay(list){
  var items=list.map(function(t){return {t:t,s:toMin(t.start),e:toMin(t.start)+t.dur};}).sort(function(a,b){return a.s-b.s||a.e-b.e;});
  var out=[],cluster=[],clusterEnd=-1;
  function flushCluster(){
    if(!cluster.length)return;
    var laneEnds=[],placed=[];
    cluster.forEach(function(it){
      var lane=-1;
      for(var i=0;i<laneEnds.length;i++){if(laneEnds[i]<=it.s){lane=i;break;}}
      if(lane===-1){lane=laneEnds.length;laneEnds.push(it.e);}else laneEnds[lane]=it.e;
      placed.push({t:it.t,lane:lane});
    });
    placed.forEach(function(p){out.push({t:p.t,lane:p.lane,lanes:laneEnds.length});});
    cluster=[];
  }
  items.forEach(function(it){
    if(cluster.length&&it.s>=clusterEnd){flushCluster();clusterEnd=-1;}
    cluster.push(it);clusterEnd=Math.max(clusterEnd,it.e);
  });
  flushCluster();
  return out;
}
function calibration(){
  var est=0,real=0,n=0;
  Object.keys(S.weeks).forEach(function(k){
    S.weeks[k].tasks.forEach(function(t){if(t.done&&t.actual>0){est+=t.dur;real+=t.actual;n++;}});
  });
  return {n:n,ratio:est?real/est:1};
}

/* ---------- ações sobre tarefas ---------- */
function saveTask(t){
  var f=findTask(t.id),newKey=weekKeyOf(t.date);
  if(f){f.week.tasks.splice(f.index,1);touch(f.key);}
  getWeek(newKey).tasks.push(normTask(clone(t)));
  touch(newKey);
}
function deleteTask(id){
  var f=findTask(id);
  if(f){f.week.tasks.splice(f.index,1);touch(f.key);}
}
function toggleDone(id){
  var f=findTask(id);
  if(!f)return;
  f.task.done=!f.task.done;
  touch(f.key);
  render();
}
function scheduleReviews(t){
  var base=parse(t.date),created=[],title='Revisar: '+t.title.replace(/^Revisar:\s*/,'');
  [1,3,7].forEach(function(n){
    var d=iso(addDays(base,n)),key=weekKeyOf(d),wk=getWeek(key);
    if(wk.tasks.some(function(x){return x.date===d&&x.title===title;}))return;
    wk.tasks.push(normTask({
      id:uid(),title:title,date:d,start:t.start,dur:Math.min(30,t.dur),kind:'estudo',goal:t.goal,
      doneWhen:'Lembrei os pontos principais sem consultar o material',
      materials:t.materials.map(function(m){return {id:uid(),title:m.title,url:m.url};})
    }));
    touch(key);created.push(d);
  });
  return created;
}
function repeatPrev(key){
  var prevKey=iso(addDays(parse(key),-7)),prev=S.weeks[prevKey];
  if(!prev||!prev.tasks.length)return 0;
  var wk=getWeek(key);
  prev.tasks.forEach(function(t){
    var c=normTask(clone(t));
    c.id=uid();c.date=iso(addDays(parse(t.date),7));c.done=false;c.actual='';
    c.materials=c.materials.map(function(m){return {id:uid(),title:m.title,url:m.url};});
    wk.tasks.push(c);
  });
  if(!wk.goals.some(Boolean))wk.goals=prev.goals.slice();
  touch(key);
  return prev.tasks.length;
}
function defaultNewTask(){
  var today=iso(new Date()),mon=parse(ui.week),date=iso(addDays(mon,ui.day));
  var wake=toMin(S.settings.wake),start=Math.max(540,wake+60);
  if(date===today){
    var n=new Date(),m=Math.ceil((n.getHours()*60+n.getMinutes()+1)/30)*30;
    if(m>=wake&&m<toMin(S.settings.sleep)-30)start=m;
  }
  return {date:date,start:fromMin(Math.min(start,1380))};
}

/* ---------- editor de materiais (reutilizável) ---------- */
function materialsEditor(getList,onChange){
  var root=h('div',{class:'mat'});
  var ul=h('ul',{class:'mat-list'});
  var msg=h('p',{class:'err',role:'alert'});
  function onEnter(e){if(e.key==='Enter'){e.preventDefault();add();}}
  var nameIn=h('input',{type:'text',placeholder:'Nome (opcional)','aria-label':'Nome do link',maxlength:'80',autocomplete:'off',onkeydown:onEnter});
  var urlIn=h('input',{type:'text',inputmode:'url',placeholder:'Cole o link aqui','aria-label':'Endereço do link',autocomplete:'off',onkeydown:onEnter});
  var addBtn=h('button',{type:'button',class:'btn sm',onclick:function(){add();}},'Adicionar link');
  function redraw(){
    ul.replaceChildren();
    var list=getList();
    if(!list.length){ul.append(h('li',{class:'empty'},'Nenhum material ainda. Cole aqui documentos, vídeos, artigos ou pastas que você vai precisar.'));return;}
    list.forEach(function(m){
      var label=m.title||hostOf(m.url);
      ul.append(h('li',{},
        icon('link',14),
        h('a',{href:m.url,target:'_blank',rel:'noopener noreferrer'},label),
        m.title?h('span',{class:'mat-host'},hostOf(m.url)):null,
        h('button',{type:'button',class:'btn text sm','aria-label':'Remover '+label,onclick:function(){
          var l=getList(),i=-1;
          for(var a=0;a<l.length;a++){if(l[a].id===m.id){i=a;break;}}
          if(i>-1)l.splice(i,1);
          onChange();redraw();
        }},icon('x',14))
      ));
    });
  }
  function add(){
    var u=safeUrl(urlIn.value);
    if(!u){msg.textContent='Esse link não parece válido. Use um endereço que comece com http ou https.';urlIn.focus();return false;}
    msg.textContent='';
    getList().push({id:uid(),title:nameIn.value.trim(),url:u});
    nameIn.value='';urlIn.value='';
    onChange();redraw();urlIn.focus();
    return true;
  }
  root.append(ul,h('div',{class:'mat-add'},nameIn,urlIn,addBtn),msg);
  redraw();
  root.flush=function(){return urlIn.value.trim()?add():true;};
  return root;
}

function timeOpts(cur){

function durOpts(cur){

      var pk=PEAKS[s.peak];

/* ---------- vista: planejar ---------- */
function goalsStrip(key,tasks){
  var wk=getWeek(key);
  var row=h('div',{class:'goal-row'});
  [0,1,2].forEach(function(g){
    var gt=tasks.filter(function(t){return t.goal===g;});
    var done=gt.filter(function(t){return t.done;}).length;
    var mins=gt.reduce(function(a,t){return a+t.dur;},0);
    var pct=gt.length?Math.round(done/gt.length*100):0;
    var inp=h('textarea',{class:'goal-in',rows:'2',maxlength:'160','aria-label':'Objetivo '+(g+1)+' da semana',placeholder:GOAL_PH[g],oninput:function(){
      var w=getWeek(key);w.goals[g]=inp.value;touch(key);
    }},wk.goals[g]);
    row.append(h('div',{class:'goal'},inp,
      h('div',{class:'gp'},
        h('div',{class:'bar'},h('span',{style:'width:'+pct+'%'})),
        h('span',{class:'gpt'},gt.length?done+' de '+gt.length+' tarefas concluídas, '+fmtDur(mins)+' planejadas':'Nenhuma tarefa ligada a este objetivo'))));
  });
  return h('section',{class:'goals','aria-labelledby':'goals-h'},
    h('h2',{id:'goals-h'},'Objetivos da semana'),
    h('p',{class:'sub'},'Até três, específicos e mensuráveis. Cada tarefa pode apontar para um deles.'),
    row);
}
function zone(cls,startMin,lenMin){
  return h('div',{class:cls,style:'top:'+(startMin/60*HOUR_PX)+'px;height:'+(lenMin/60*HOUR_PX)+'px'});
}
function blockEl(t,lane,lanes,gs){
  var top=(toMin(t.start)-gs)/60*HOUR_PX,height=Math.max(t.dur/60*HOUR_PX,20);
  var end=fromMin(Math.min(toMin(t.start)+t.dur,1440));
  var el=h('div',{
    class:'blk k-'+t.kind+(t.done?' done':'')+(height<40?' tight':''),role:'button',tabindex:'0',
    style:'top:'+top+'px;height:'+height+'px;left:calc('+(lane*100/lanes)+'% + 2px);width:calc('+(100/lanes)+'% - 4px)',
    'aria-label':t.title+', '+t.start+' às '+end+(t.done?', concluída':''),
    onclick:function(){openTask(t.id);},
    onkeydown:function(e){if((e.key==='Enter'||e.key===' ')&&e.target===el){e.preventDefault();openTask(t.id);}}
  },
    h('button',{type:'button',class:'chk','aria-label':t.done?'Marcar como não concluída':'Marcar como concluída','aria-pressed':t.done?'true':'false',onclick:function(e){e.stopPropagation();toggleDone(t.id);}},t.done?icon('check',12):null),
    h('div',{class:'bt'},
      h('span',{class:'tt'},t.title),
      h('span',{class:'tm'},t.start+'–'+end),
      t.materials.length?h('span',{class:'lk'},icon('link',11),String(t.materials.length)):null));
  return el;
}
function dayHead(i,ds,dayTasks,isToday){
  var st=weekStats(dayTasks),lim=dayLimit(),over=st.planned>lim;
  var pct=Math.min(100,Math.round(st.planned/lim*100));
  return h('div',{class:'dh'+(isToday?' today':'')+(i===ui.day?' active':'')},
    h('div',{},h('span',{class:'dn'},DAYS_SHORT[i]),h('span',{class:'dd'},String(parse(ds).getDate()))),
    h('div',{class:'cap'+(over?' over':'')},h('span',{style:'width:'+pct+'%'})),
    h('div',{class:'capt'},st.planned?fmtDur(st.planned)+' de '+fmtDur(lim):'Livre'),
    over?h('div',{class:'warnt'},'Sem folga para imprevistos'):null,
    st.deep>240?h('div',{class:'warnt'},'Foco acima de 4h'):null);
}
function viewPlan(){
  var key=ui.week,wk=getWeek(key),tasks=wk.tasks.slice().sort(cmpTask),monday=parse(key),today=iso(new Date());
  var rg=gridRange(tasks),gs=rg.s,ge=rg.e,rows=(ge-gs)/60,H=rows*HOUR_PX;
  var root=h('div',{class:'plan'});
  root.append(goalsStrip(key,tasks));

  if(!tasks.length){
    var prev=S.weeks[iso(addDays(monday,-7))];
    root.append(h('div',{class:'empty-note'},
      h('p',{},'Semana em branco. Escreva até três objetivos acima e clique em um horário livre da grade para reservar um bloco.'),
      prev&&prev.tasks.length?h('button',{type:'button',class:'btn',onclick:function(){
        var n=repeatPrev(key);render();toast(plural(n,'tarefa copiada','tarefas copiadas')+' da semana anterior.');
      }},'Repetir a semana anterior'):null));
  }

  var tabs=h('div',{class:'daytabs'});
  for(var i=0;i<7;i++){(function(i){
    var ds=iso(addDays(monday,i));
    tabs.append(h('button',{type:'button',class:'daytab'+(ds===today?' today':''),'aria-pressed':i===ui.day?'true':'false','aria-label':DAYS_LONG[i]+', dia '+parse(ds).getDate(),onclick:function(){ui.day=i;render();}},DAYS_SHORT[i],h('span',{},String(parse(ds).getDate()))));
  })(i);}
  root.append(tabs);

  var grid=h('div',{class:'grid'});
  grid.append(h('div',{class:'corner'}));
  var cols=[];
  var wake=toMin(S.settings.wake),sleep=toMin(S.settings.sleep),pk=PEAKS[S.settings.peak];
  var nowD=new Date(),nowMin=nowD.getHours()*60+nowD.getMinutes();
  for(var d=0;d<7;d++){(function(d){
    var ds=iso(addDays(monday,d)),dayTasks=tasks.filter(function(t){return t.date===ds;});
    grid.append(dayHead(d,ds,dayTasks,ds===today));
    var col=h('div',{class:'col'+(ds===today?' today':'')+(d===ui.day?' active':''),style:'height:'+H+'px','aria-label':DAYS_LONG[d]+', '+parse(ds).getDate()});
    if(wake>gs)col.append(zone('sleepz',0,wake-gs));
    if(sleep<ge)col.append(zone('sleepz',sleep-gs,ge-sleep));
    var pf=Math.max(pk.from,gs),pt=Math.min(pk.to,ge);
    if(pt>pf)col.append(zone('peakz',pf-gs,pt-pf));
    layoutDay(dayTasks).forEach(function(p){col.append(blockEl(p.t,p.lane,p.lanes,gs));});
    if(ds===today&&nowMin>=gs&&nowMin<ge)col.append(h('div',{class:'now',style:'top:'+((nowMin-gs)/60*HOUR_PX)+'px'}));
    col.addEventListener('click',function(ev){
      if(ev.target!==col)return;
      var y=ev.clientY-col.getBoundingClientRect().top;
      var m=gs+Math.floor(y/HOUR_PX*2)*30;
      m=Math.max(gs,Math.min(m,ge-30,1410));
      openTask(null,{date:ds,start:fromMin(m)});
    });
    cols.push(col);
  })(d);}
  var gut=h('div',{class:'gut','aria-hidden':'true'});
  for(var hh=gs/60;hh<ge/60;hh++)gut.append(h('div',{class:'hr'},hh+'h'));
  grid.append(gut);
  cols.forEach(function(c){grid.append(c);});
  root.append(grid);

  root.append(h('ul',{class:'legend'},
    KIND_KEYS.map(function(k){return h('li',{style:'--c:var(--k-'+k+')'},h('span',{class:'sw'}),KINDS[k].label);}),
    h('li',{},h('span',{class:'sw peak'}),'Seu pico de foco'),
    h('li',{},h('span',{class:'sw sleep'}),'Horas de sono')));
  return root;
}

function viewMethods(){
  var root=h('div',{class:'methods'});
  root.append(h('p',{class:'lead'},'A estrutura desta semana usa técnicas com pesquisa por trás. Em cada uma, indico o quanto a evidência é sólida e onde ela termina.'));
  METHODS.forEach(function(m){
    root.append(h('article',{},
      h('h3',{},m.t),
      h('p',{},m.p),
      h('p',{class:'no-app'},h('b',{},'No app: '),m.a),
      h('p',{class:'ev'},h('b',{},'Evidência: '),m.e+' ',h('span',{},'Fonte: '+m.s))));
  });
  root.append(h('article',{},h('p',{class:'ev'},'Os resultados são médias de grupos, não garantias para uma pessoa. Nenhuma dessas técnicas foi testada nesta ferramenta específica. Use a aba Revisão para descobrir o que funciona com você. Para conferir as fontes, busque pelos autores e pelo ano.')));
  return root;
}

/* ---------- render ---------- */
function render(){
  pendingRender=false;
  renderMast();
  var v=$('#view');v.replaceChildren();
  if(ui.tab==='plan')v.append(viewPlan());
  else if(ui.tab==='mats')v.append(viewMats());
  else if(ui.tab==='review')v.append(viewReview());
  else v.append(viewMethods());
}

/* ---------- início ---------- */
loadLocal();
syncDay();
render();
var dlgEl=$('#dlg');
dlgEl.addEventListener('close',function(){if(pendingRender)render();});
dlgEl.addEventListener('click',function(e){if(e.target===dlgEl)dlgEl.close();});
document.addEventListener('focusout',function(){setTimeout(function(){if(pendingRender&&!modalOpen()&&!isTyping())render();},0);});
setInterval(function(){if(ui.tab==='plan'&&!modalOpen()&&!isTyping())render();},60000);
initRemote();
})();
</script>
